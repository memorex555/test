<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas"></canvas>
    <div id="score">Score: 0</div>
    <p>Use the Arrow Keys (Up, Down, Left, Right) to control the snake. Eat the red food to grow and score points. Avoid hitting the walls or the snake's own body!</p>
    <script src="script.js"></script>
</body>
</html>
